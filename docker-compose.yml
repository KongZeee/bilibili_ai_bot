services:
  bilibot:
    build: .
    container_name: bilibot
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      # 健康检查端口：必须与 config.yaml 的 web.port 一致，且 web.enabled=true
      - BILIBOT_WEB_PORT=8080
    restart: unless-stopped
    networks:
      - bilibot-network

networks:
  bilibot-network:
    driver: bridge