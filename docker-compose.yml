version: '3.8'

services:
  bilibot:
    build: .
    container_name: bilibot
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - bilibot-network

networks:
  bilibot-network:
    driver: bridge