# BiliBot Standalone Configuration
# 复制为 config.yaml 并填写实际值
#
# ═══ 模型配置中心（V3 统一架构） ═══
# 参考 AstrBot 设计：每种能力独立 Provider 列表 + model_routing 路由
# 功能与模型解耦：换模型只改 routing，不碰功能配置
#
config_version: 5

# ── 对话模型（主动回复 / 动态文本 / 记忆提取） ──
chat_providers:
  - id: siliconflow
    name: 硅基流动
    api_key: ""
    base_url: "https://api.siliconflow.cn/v1"
    model: "Qwen/Qwen2.5-72B-Instruct"
    max_tokens: 1024
    temperature: 0.8
    enabled: true
  # 可添加更多：
  # - id: openai
  #   name: OpenAI
  #   api_key: ""
  #   base_url: "https://api.openai.com/v1"
  #   model: "gpt-4o"

# ── 视觉模型（视频理解视觉轨） ──
vision_providers:
  - id: siliconflow-vision
    name: 硅基流动视觉
    api_key: ""                    # 留空则回退到对话模型的 api_key
    base_url: "https://api.siliconflow.cn/v1"
    model: "Qwen/Qwen2-VL-72B-Instruct"
    enabled: false

# ── Embedding 模型（记忆系统向量检索） ──
embedding_providers:
  - id: siliconflow-embed
    name: 硅基流动 Embedding
    api_key: ""                    # 留空则回退到对话模型的 api_key
    base_url: "https://api.siliconflow.cn/v1"
    model: "BAAI/bge-m3"
    enabled: false

# ── ASR 语音识别模型（视频理解音频轨） ──
asr_providers:
  - id: siliconflow-asr
    name: 硅基流动 ASR
    api_key: ""                    # 留空则回退到对话模型的 api_key
    base_url: "https://api.siliconflow.cn/v1"
    model: ""                      # 例如 mimo-v2.5-asr
    enabled: false
  # 本地 Whisper 配置；云端 ASR 失败时可作为后备。
  - id: local-whisper
    enabled: false
    model_size: "base"             # tiny/base/small/medium/large-v3
    device: "cpu"                  # cpu/cuda/directml
    compute_type: "int8"

# ── 文生图模型（动态配图） ──
image_providers:
  - id: agnes-image
    name: Agnes 文生图
    api_key: ""
    base_url: "https://apihub.agnes-ai.com/v1"
    model: "agnes-image-2.1-flash"
    default_size: "1024x768"
    timeout: 120
    enabled: false

# ── 功能路由（核心：每个功能用哪个 Provider） ──
model_routing:
  chat: siliconflow               # 对话（主动回复/动态/记忆提取）
  vision: siliconflow-vision      # 视频视觉轨
  embedding: siliconflow-embed    # 记忆向量检索
  asr: siliconflow-asr            # 视频音频轨
  image: agnes-image              # 动态配图

# PRD-V5 §5.3 LLM-501：生产模式不允许 LLM 静默回退
allow_llm_fallback: false

# Chat and Vision providers sharing one endpoint and credential share this gate.
model_request_limits:
  chat_completion_max_concurrency_per_endpoint: 2

# ── V2: 多账号 ──

# 人格配置组（profile）：一组人格的集合，账号可引用一个 profile
# 参考 AstrBot 的多配置文件设计：一个 profile 类似一个 abconf_，含默认人格 + 可用人格池
# 账号可通过 profile_id 引用 profile，运行时可在 profile.personas 中切换激活人格
profiles:
  - id: default
    name: 默认人格组
    default_persona: default       # 主人格 ID（账号激活时默认使用）
    personas:                       # 该 profile 可用的所有人格 ID 列表
      - default
    # 可添加更多人格组：
    # - id: multi_style
    #   name: 多风格切换
    #   default_persona: tech_persona
    #   personas: [tech_persona, casual_persona, gamer_persona]

accounts:
  - id: main
    name: 主账号
    sessdata: ""
    bili_jct: ""
    dede_user_id: ""
    buvid3: ""
    refresh_token: ""
    profile_id: default            # 引用人格组（优先于 persona_id）
    persona_id: default            # 向后兼容：未配 profile_id 时使用单个人格
    chat_provider_id: ""           # 绑定的对话 Provider ID（留空用 model_routing.chat）
    enabled: true
  # 可添加更多账号：
  # - id: sub
  #   name: 小号
  #   sessdata: ""
  #   bili_jct: ""
  #   dede_user_id: ""
  #   profile_id: multi_style      # 引用多风格 profile，运行时可切换人格
  #   llm_id: openai
  #   enabled: true

default_account: main

# ── 联网搜索 ──
web_search:
  enabled: false
  backend: "tavily"  # tavily / perplexity / bocha / custom
  api_key: ""
  api_base: ""  # custom 后端时需要
  model: ""  # perplexity/custom 时需要
  max_results: 5
  # PRD V4 SEA-006：每账号日预算
  daily_budget_per_account: 100
  # PRD-V5 §10.2 SEA-502：Custom 后端显式声明是否具备联网搜索能力
  # true=显式支持（直接作为搜索后端）；false=显式不支持；留空=运行时能力探测
  # 普通 Chat Completions（无联网能力）不可标记为已联网搜索
  supports_web_search: true
  # PRD-V5 §10.1 SEA-502：429/5xx/网络错误指数退避（受 TaskRun 超时控制）
  retry:
    base_delay: 1.0      # 基础延迟（秒）
    factor: 2.0          # 退避因子
    max_delay: 60.0      # 最大延迟（秒）
    max_attempts: 3      # 最大重试次数（不含首次）
  # PRD V4 SEA-002：场景级开关矩阵
  scenes:
    reply_comment: { enabled: true }
    private_message: { enabled: false, redact_query: true }
    proactive_video: { enabled: true }
    dynamic_post: { enabled: false }
    weekly_summary: { enabled: false }
  # PRD V4 SEA-006：按 freshness 差异化缓存 TTL
  cache:
    realtime_ttl_seconds: 300   # 5 分钟：新闻、热点
    daily_ttl_seconds: 1800     # 30 分钟：一般信息
    stable_ttl_seconds: 86400   # 24 小时：百科、历史

# ── Bot 人格 ──
personality:
  # 主人UID (特殊对待)
  owner_mid: ""
  owner_name: "主人"

  # 是否启用心情系统
  enable_mood: true

  # 人格库通过 Web 面板管理（PRD §5.3），不再在此处配置 prompt

# ── 功能开关（PRD §5.2 集中管理）──
features:
  reply_comment: true        # 评论回复
  private_message: false     # 私信
  proactive_video: true      # 主动看视频
  proactive_comment: true    # 主动评论
  dynamic_post: true         # 动态发布
  bangumi: false             # 番剧追更
  weekly_summary: true       # 周总结
  web_search: false          # 联网搜索
  affection: true            # 好感度系统
  mood: true                 # 心情系统

# ── 动态发布（PRD §5.2 / §5.6）──
dynamic_publish:
  # 主题池（留空则由 Bot 自由发挥）
  topics: []
  # 是否配图（需要 image_generation.enabled 同时开启）
  with_image: false
  # 发布前是否需要 Web 审核
  review_before_publish: false
  # 草稿过期时间（秒），过期后自动标记 expired，永不发布
  draft_expiry_seconds: 86400

# ── 互动决策预算（PRD V4 §8.7 VID-006 / §10.2 COM-002）──
# 模型只输出建议，最终决策由确定性 PolicyEngine 执行
# LLM 失败时所有有副作用动作默认为 false
interactions:
  like:
    enabled: false
    max_per_day: 10
    score_threshold: 6
  coin:
    enabled: false
    max_per_day: 0
    max_per_video: 1
    score_threshold: 8
  favorite:
    enabled: false
    max_per_day: 5
    score_threshold: 8
  comment:
    enabled: true
    max_per_day: 10
    score_threshold: 7

# ── 文生图（动态配图） ──
# 注意：模型配置已迁移到 image_providers + model_routing.image
# 此段保留动态配图的功能开关
image_generation:
  # 是否在发动态时配图（需 model_routing.image 指向已启用的 image_provider）
  with_image: false

# ── 安全与审核（PRD §5.9 / SAFE-501 账号级隔离）──
safety:
  # 发布频率限制（SAFE-501：account_id+scene 隔离，账号间互不抢占配额）
  rate_limit:
    enabled: true
    per_minute: 5          # 每账号+场景：每分钟上限
    per_hour: 50           # 每账号+场景：每小时上限
    per_day: 200           # 每账号+场景：每天上限
    global_quota: 1000     # 全局日配额：所有账号+场景合计上限
  # 发布前内容检查
  # content_check_enabled=false 时仅跳过可选内容规则（敏感词/重复度/人格），
  # 不跳过：全局暂停、账号风险暂停、硬性长度限制
  content_check_enabled: true
  min_content_length: 2
  max_content_length: 2000
  # 重复度检查（SAFE-501：按 account_id 隔离存储）
  duplicate_check:
    enabled: true
    window_size: 10              # 每账号保留的最近内容条数
    similarity_threshold: 0.8    # 0-1，相似度 >= 该值视为重复

# ── 主动行为 ──
proactive:
  # 主动看视频次数/天
  video_count: 2
  # PRD 5.1：video_times 已废弃，实际由 video_count 随机生成时间

  # 发动态次数/天
  dynamic_count: 1
  # PRD 5.1：dynamic_times 已废弃，实际由 dynamic_count 随机生成时间

  # PRD 6.2：兴趣关键词（用于主动视频推荐筛选）
  interest_keywords: ["科技", "AI", "编程", "游戏", "音乐"]

  # Task 26：禁用短语（主动评论中禁止出现，避免与真实 watch_state 冲突）
  # 大小写不敏感子串匹配；未配置时使用内置默认表
  # forbidden_phrases: ["我完整看完了", "我看完了", "完整看完"]
  # 正则变体（IGNORECASE 编译，覆盖"完整.*看完"、"看完了?"等中间插字/可选字变体）
  # forbidden_phrase_patterns: ["完整.{0,4}看完", "看完了?"]

  # PRD 4.17：bangumi/special_follow 在 config_loader 中为 bool 类型，
  # V2 未实现番剧追更/特别关注，保持 false（旧版对象式配置已清理）
  bangumi: false
  special_follow: false

  # PRD-V5 §7 / TASK-501：TaskRun 持久化生命周期配置
  # 默认迟到窗口（秒）：scheduled_at + grace_window 内仍可 claim，超过则 expired
  grace_window_seconds: 900  # 15 分钟
  # 场景级配置（覆盖默认 grace_window_seconds / max_attempts）
  scenes:
    proactive_video:
      grace_window_seconds: 900
      max_attempts: 3
    dynamic:
      grace_window_seconds: 900
      max_attempts: 3
    weekly_summary:
      grace_window_seconds: 3600  # 周总结 1 小时窗口
      max_attempts: 1
    proactive_comment:
      grace_window_seconds: 900
      max_attempts: 3

# ── 评论回复 ──
reply:
  # 是否启用自动回复评论
  auto_reply: true
  # 回复过滤关键词
  block_keywords: ["傻逼", "草泥马", "滚", "死", "废物", "智障", "脑残"]
  # 最小评论长度才回复
  min_comment_length: 2
  # 是否回复自己的评论
  reply_own: false

# ── 视频分析（视听双轨理解） ──
# 注意：Vision/ASR 模型配置已迁移到 vision_providers / asr_providers + model_routing
# 此段保留视频分析的资源边界和抽帧策略
video_analysis:
  # 启用视频下载 + 视听双轨分析（需要 ffmpeg）
  enabled: false
  # PRD-V5 §8.2 VID-503：资源边界配置
  max_duration_seconds: 600
  max_download_bytes: 209715200
  max_concurrent_global: 1
  max_concurrent_per_account: 1
  download_timeout_seconds: 90
  preprocess_timeout_seconds: 180
  analysis_timeout_seconds: 600
  max_local_whisper_workers: 1
  temp_disk_quota_bytes: 1073741824
  # 抽帧策略: katna / scenedetect / ffmpeg
  frame_extractor: "ffmpeg"
  scenedetect_threshold: 27.0
  image_max_size: 768
  # Vision frames remain one observation each, but request starts are paced.
  vision_window_size: 2
  vision_requests_per_minute: 10
  # 临时目录（留空则用 {data_dir}/video_temp）
  temp_dir: ""

# ── 记忆系统 ──
memory:
  # V6 账号级统一联想记忆大脑
  recall_candidate_limit: 20
  recall_inject_limit: 5
  recall_association_limit: 2
  rerank_relevance_baseline: 0.65
  prompt_char_budget: 5000
  chunk_target_chars: 600
  chunk_hard_chars: 900
  chunk_target_tokens: 450
  chunk_hard_tokens: 700
  chunk_overlap_chars: 100
  job_max_attempts: 8
  vector_cache_limit: 50000
  vector_batch_size: 2048

# ── Web 管理面板 ──
web:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  secret_key: "change-this-to-a-random-string"  # 会话签名密钥，生产环境务必修改
  admin_username: "admin"
  admin_password: "admin123"  # 默认密码，生产环境务必修改
  # 会话 TTL（秒），超时自动登出
  session_ttl_seconds: 3600
  # CORS 允许来源，留空表示不开放任意跨域（生产建议保持空）
  # 如需前端独立部署可填具体来源，如 ["http://localhost:3000"]
  cors_origins: []
  # 是否启用 Secure Cookie（仅 HTTPS 下生效；HTTP 本地开发可设 false）
  secure_cookies: true
  # 可信代理列表：仅当请求直连 IP 在此列表中时才信任 X-Forwarded-For 首段作为客户端 IP
  # 用于防止登录限流被伪造 X-Forwarded-For 绕过。留空表示不信任任何代理，始终使用直连 IP
  # 示例: ["127.0.0.1", "10.0.0.2"]
  trusted_proxies: []

# ── CLI ──
# PRD 5.1：cli.enabled 无代码引用，已删除（CLI 入口由 __main__.py 直接判断 --quickstart 参数）

# ── 数据目录 ──
data_dir: "./data"  # 默认在当前目录下的data文件夹

# ── 日志 ──
logging:
  level: "INFO"  # DEBUG / INFO / WARNING / ERROR
  file: "./data/bililog.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5
