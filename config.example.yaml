# BiliBot Standalone Configuration
# 复制为 config.yaml 并填写实际值
#
# ═══ 模型配置中心（V3 统一架构） ═══
# 参考 AstrBot 设计：每种能力独立 Provider 列表 + model_routing 路由
# 功能与模型解耦：换模型只改 routing，不碰功能配置
#
config_version: 5

# ── 对话模型（主动回复 / 动态文本 / 记忆提取） ──
chat_providers:
  - id: siliconflow
    name: 硅基流动
    api_key: ""
    # 可选：多 API Key 密钥池（同 base_url/model），并行分发降低 429
    # api_keys:
    #   - "sk-key-1"
    #   - "sk-key-2"
    base_url: "https://api.siliconflow.cn/v1"
    model: "Qwen/Qwen2.5-72B-Instruct"
    max_tokens: 1024
    temperature: 0.8
    # 推理型模型（如 agnes-2.0-flash）单次调用可能耗时数分钟；
    # 建议显式放大 HTTP 超时，避免记忆富化被 APITimeoutError 打断。
    timeout: 600
    enabled: true
  # 可添加更多：
  # - id: openai
  #   name: OpenAI
  #   api_key: ""
  #   base_url: "https://api.openai.com/v1"
  #   model: "gpt-4o"

# ── 视觉模型（视频理解视觉轨） ──
vision_providers:
  - id: siliconflow-vision
    name: 硅基流动视觉
    api_key: ""                    # 留空则回退到对话模型的 api_key
    # 视频理解高并发推荐配置多 key：
    # api_keys:
    #   - "sk-vision-1"
    #   - "sk-vision-2"
    base_url: "https://api.siliconflow.cn/v1"
    model: "Qwen/Qwen2-VL-72B-Instruct"
    timeout: 600
    enabled: false

# ── Embedding 模型（记忆系统向量检索） ──
embedding_providers:
  - id: siliconflow-embed
    name: 硅基流动 Embedding
    api_key: ""                    # 留空则回退到对话模型的 api_key
    base_url: "https://api.siliconflow.cn/v1"
    model: "BAAI/bge-m3"
    enabled: false

# ── Rerank 模型（记忆召回精排；优先于对话 JSON 重排） ──
rerank_providers:
  - id: siliconflow-rerank
    name: 硅基流动 Rerank
    api_key: ""                    # 留空则回退到对话模型的 api_key
    base_url: "https://api.siliconflow.cn/v1"
    model: "BAAI/bge-reranker-v2-m3"
    enabled: false

# ── ASR 语音识别模型（视频理解音频轨） ──
asr_providers:
  - id: siliconflow-asr
    name: 硅基流动 ASR
    api_key: ""                    # 留空则回退到对话模型的 api_key
    base_url: "https://api.siliconflow.cn/v1"
    model: ""                      # 例如 mimo-v2.5-asr
    enabled: false
  # 本地 Whisper 配置；云端 ASR 失败时可作为后备。
  - id: local-whisper
    enabled: false
    model_size: "base"             # tiny/base/small/medium/large-v3
    device: "cpu"                  # cpu/cuda/directml
    compute_type: "int8"

# ── 文生图模型（动态配图） ──
image_providers:
  - id: agnes-image
    name: Agnes 文生图
    api_key: ""
    base_url: "https://apihub.agnes-ai.com/v1"
    model: "agnes-image-2.1-flash"
    default_size: "1024x768"
    timeout: 120
    enabled: false

# ── 功能路由（核心：每个功能用哪个 Provider） ──
model_routing:
  chat: siliconflow               # 对话（主动回复/动态/记忆提取）
  vision: siliconflow-vision      # 视频视觉轨
  embedding: siliconflow-embed    # 记忆向量检索
  rerank: siliconflow-rerank      # 记忆重排序（专用模型；未启用则回退 chat JSON）
  asr: siliconflow-asr            # 视频音频轨
  image: agnes-image              # 动态配图

# PRD-V5 §5.3 LLM-501：生产模式不允许 LLM 静默回退
allow_llm_fallback: false

# 模型请求限制（配置页可改）
# - 每密钥并发：同一 base_url+api_key 的最大并发
# - 429 冷却：触发速率限制后该密钥暂停使用秒数
# - 视觉并发硬顶：视频理解视觉轨并发绝对上限（与密钥数、每密钥并发共同决定实际并行）
model_request_limits:
  chat_completion_max_concurrency_per_endpoint: 2
  rate_limit_cooldown_seconds: 30
  vision_max_concurrency_hard_cap: 8

# ── B站账号与人格 ──
# 仅支持一个 B站账号；人格库可切换多个人格
# 人格配置组（profile）：一组人格的集合，唯一账号可通过 profile_id 引用
# 运行时可在 profile.personas / Web 人格库中切换激活人格（非多 B站账号）
profiles:
  - id: default
    name: 默认人格组
    default_persona: default       # 主人格 ID（账号激活时默认使用）
    personas:                       # 该 profile 可用的所有人格 ID 列表
      - default
    # 可选：更多人格组（仍挂在同一 B站账号下，用于切换人格池）
    # - id: multi_style
    #   name: 多风格切换
    #   default_persona: tech_persona
    #   personas: [tech_persona, casual_persona, gamer_persona]

# 仅配置一个 B站账号条目；请勿添加第二个
accounts:
  - id: main
    name: 主账号
    sessdata: ""
    bili_jct: ""
    dede_user_id: ""
    buvid3: ""                     # 设备指纹；空则启动时自动领取
    buvid4: ""                     # 新版设备指纹；空则与 buvid3 一并领取
    refresh_token: ""              # 扫码登录后写入；用于 SESSDATA 自动刷新
    profile_id: default            # 引用人格组（优先于 persona_id）
    persona_id: default            # 向后兼容：未配 profile_id 时使用单个人格
    chat_provider_id: ""           # 绑定的对话 Provider ID（留空用 model_routing.chat）
    enabled: true

default_account: main

# ── 联网搜索 ──
web_search:
  enabled: false
  backend: "tavily"  # tavily / perplexity / bocha / custom
  api_key: ""
  api_base: ""  # custom 后端时需要
  model: ""  # perplexity/custom 时需要
  max_results: 5
  # PRD V4 SEA-006：每账号日预算
  daily_budget_per_account: 100
  # PRD-V5 §10.2 SEA-502：Custom 后端显式声明是否具备联网搜索能力
  # true=显式支持（直接作为搜索后端）；false=显式不支持；留空=运行时能力探测
  # 普通 Chat Completions（无联网能力）不可标记为已联网搜索
  supports_web_search: true
  # PRD-V5 §10.1 SEA-502：429/5xx/网络错误指数退避（受 TaskRun 超时控制）
  retry:
    base_delay: 1.0      # 基础延迟（秒）
    factor: 2.0          # 退避因子
    max_delay: 60.0      # 最大延迟（秒）
    max_attempts: 3      # 最大重试次数（不含首次）
  # PRD V4 SEA-002：场景级开关矩阵
  scenes:
    reply_comment: { enabled: true }
    # 私信默认关闭联网搜索；若 enabled=true 则 redact_query 必须为 true（配置保存会校验）
    private_message: { enabled: false, redact_query: true }
    proactive_video: { enabled: true }
    dynamic_post: { enabled: false }
    weekly_summary: { enabled: false }
  # PRD V4 SEA-006：按 freshness 差异化缓存 TTL
  cache:
    realtime_ttl_seconds: 300   # 5 分钟：新闻、热点
    daily_ttl_seconds: 1800     # 30 分钟：一般信息
    stable_ttl_seconds: 86400   # 24 小时：百科、历史

# ── Bot 人格 ──
personality:
  # 主人UID (特殊对待)
  owner_mid: ""
  owner_name: "主人"

  # 是否启用心情系统
  enable_mood: true

  # 人格库通过 Web 面板管理（PRD §5.3），不再在此处配置 prompt

# ── 功能开关（PRD §5.2 集中管理）──
# 热重载后 scheduler / companion / bangumi 会按此段同步；memory 始终按账号装配。
# 联网搜索总开关以 web_search.enabled 为准；features.web_search 仅为兼容位。
# 私信不得按评论场景触发联网搜索：web_search.scenes.private_message.enabled 默认 false，
# 若打开则 redact_query 必须为 true（PATCH /api/config 会校验）。
features:
  reply_comment: true        # 评论回复（入脑 + 混合召回）
  private_message: false     # 私信（脱敏后入脑）
  proactive_video: true      # 主动看视频（视听归档失败会 pause_account）
  proactive_comment: true    # 主动评论（依赖 proactive_video 流程）
  dynamic_post: true         # 动态发布（scene=dynamic_post，读写 brain）
  bangumi: false             # 番剧追更（需账号 memory_brain；无 brain fail-closed）
  weekly_summary: true       # 周总结（写入 weekly_summary 事件）
  web_search: false          # 兼容位；真实生效见 web_search.enabled
  affection: true            # 好感度系统
  mood: true                 # 心情系统
  # B站 Cookie 自动检查间隔（小时）；账号级 ConfigLoader 会覆盖 bilibili 段，故放 features
  cookie_check_interval_hours: 6
  # companion: false         # 可选别名；优先使用下方 companion.enabled

# ── 番剧追更策略 ──
# features.bangumi 控制启停；看番原始内容、评价和每次动作意图/结果均写入账号统一记忆。
# 评论/点赞/追番还会经过全局暂停、账号暂停、内容检查和频率限制。
bangumi:
  pools: ["trending"]       # 可选 trending / timeline / random
  max_episodes: 3           # 每次检查最多观看 1-10 集
  continue_score: 7         # 低于此分且模型不想继续时停止
  comment: true
  auto_follow: true

# ── 陪伴生活层（人格化日程/梦境/日记/探索/创作；默认关闭）──
# enabled=false 时不写脏、不注入 prompt；热重载会 rebind memory_brain。
# 灵感来自 astrbot_plugin_private_companion 概念，按单 B 站账号 + 人格库架构重写
companion:
  enabled: false             # 总开关
  life_state:
    enabled: true
    inject_into_replies: true  # get_prompt_surface → 评论/私信 system 尾部
    energy_default: 70
  schedule:
    enabled: true
    generate_time: "07:30"   # 每日生成日程时间
    item_count: 8
    detail_lead_minutes: 15  # 时段开始前多久细化
  dream:
    enabled: true
    generate_with_diary: true
  diary:
    enabled: true
    time: "23:10"
    max_entries: 14
    offer_dynamic_draft: false   # 日记 share_seed 是否进动态草稿箱
  exploration:
    enabled: false               # 依赖 web_search.enabled；写入 web_reference/exploration
    min_interval_hours: 8
    max_results: 6
    interests: []                # 空则从人格 interests/tags + proactive.interest_keywords 推断
    offer_dynamic_draft: false
  news:
    enabled: false
    min_interval_hours: 6
    sources: []                  # 预留 RSS URL 列表
  creative:
    enabled: false
    max_active_projects: 2
    chars_per_session: 220
    inspiration_probability: 0.2
    offer_dynamic_draft: false
  dynamic_share:
    require_review: true

# ── 动态发布（PRD §5.2 / §5.6）──
# 生成侧注入 V6 recall + companion；发布结果 bot_action scene=dynamic_post
dynamic_publish:
  # 主题池（留空则由 Bot 自由发挥 / 陪伴 pick_dynamic_topic）
  topics: []
  # 是否配图（需要 image_generation.enabled 同时开启）
  with_image: false
  # 动态配图风格：cinematic / anime / photorealistic / digital_illustration /
  # watercolor / cyberpunk / pixel_art / minimalist / custom
  image_style: cinematic
  # image_style=custom 时生效，建议用简短视觉描述（最多 300 字符）
  image_style_custom: ""
  # 发布前是否需要 Web 审核（审核通过后独立 TaskRun 发布并写脑）
  review_before_publish: false
  # 草稿过期时间（秒），过期后自动标记 expired，永不发布
  draft_expiry_seconds: 86400

# ── 互动决策预算（PRD V4 §8.7 VID-006 / §10.2 COM-002）──
# 模型只输出建议，最终决策由确定性 PolicyEngine 执行
# LLM 失败时所有有副作用动作默认为 false
interactions:
  like:
    enabled: false
    max_per_day: 10
    score_threshold: 6
  coin:
    enabled: false
    max_per_day: 0
    max_per_video: 1
    score_threshold: 8
  favorite:
    enabled: false
    max_per_day: 5
    score_threshold: 8
  comment:
    enabled: true
    max_per_day: 10
    score_threshold: 7

# ── 文生图（动态配图） ──
# 注意：模型配置已迁移到 image_providers + model_routing.image
# 此段保留动态配图的功能开关
image_generation:
  # 是否在发动态时配图（需 model_routing.image 指向已启用的 image_provider）
  with_image: false

# ── 安全与审核（PRD §5.9 / SAFE-501 账号级隔离）──
safety:
  # 发布频率限制（SAFE-501：account_id+scene 隔离，账号间互不抢占配额）
  rate_limit:
    enabled: true
    per_minute: 5          # 每账号+场景：每分钟上限
    per_hour: 50           # 每账号+场景：每小时上限
    per_day: 200           # 每账号+场景：每天上限
    global_quota: 1000     # 全局日配额：所有账号+场景合计上限
  # 发布前内容检查
  # content_check_enabled=false 时仅跳过可选内容规则（敏感词/重复度/人格），
  # 不跳过：全局暂停、账号风险暂停、硬性长度限制
  content_check_enabled: true
  min_content_length: 2
  max_content_length: 2000
  # 重复度检查（SAFE-501：按 account_id 隔离存储）
  duplicate_check:
    enabled: true
    window_size: 10              # 每账号保留的最近内容条数
    similarity_threshold: 0.8    # 0-1，相似度 >= 该值视为重复

# ── 主动行为 ──
proactive:
  # 主动看视频次数/天
  video_count: 2
  # PRD 5.1：video_times 已废弃，实际由 video_count 随机生成时间

  # 发动态次数/天
  dynamic_count: 1
  # PRD 5.1：dynamic_times 已废弃，实际由 dynamic_count 随机生成时间

  # PRD 6.2：兴趣关键词（用于主动视频推荐筛选）
  interest_keywords: ["科技", "AI", "编程", "游戏", "音乐"]

  # Task 26：禁用短语（主动评论中禁止出现，避免与真实 watch_state 冲突）
  # 大小写不敏感子串匹配；未配置时使用内置默认表
  # forbidden_phrases: ["我完整看完了", "我看完了", "完整看完"]
  # 正则变体（IGNORECASE 编译，覆盖"完整.*看完"、"看完了?"等中间插字/可选字变体）
  # forbidden_phrase_patterns: ["完整.{0,4}看完", "看完了?"]

  # 兼容旧配置；启停以 features.bangumi 为准，具体策略用顶层 bangumi 对象。
  bangumi: false
  special_follow: false

  # PRD-V5 §7 / TASK-501：TaskRun 持久化生命周期配置
  # 默认迟到窗口（秒）：scheduled_at + grace_window 内仍可 claim，超过则 expired
  grace_window_seconds: 900  # 15 分钟
  # 场景级配置（覆盖默认 grace_window_seconds / max_attempts）
  scenes:
    proactive_video:
      grace_window_seconds: 900
      max_attempts: 3
    dynamic:
      grace_window_seconds: 900
      max_attempts: 3
    weekly_summary:
      grace_window_seconds: 3600  # 周总结 1 小时窗口
      max_attempts: 1
    proactive_comment:
      grace_window_seconds: 900
      max_attempts: 3
    bangumi:
      grace_window_seconds: 21600  # 看番可能耗时较长，允许 6 小时迟到窗口
      max_attempts: 3

# ── 评论回复 ──
reply:
  # 是否启用自动回复评论
  auto_reply: true
  # 回复过滤关键词
  block_keywords: ["傻逼", "草泥马", "滚", "死", "废物", "智障", "脑残"]
  # 最小评论长度才回复
  min_comment_length: 2
  # 是否回复自己的评论
  reply_own: false
  # 评论发布最小间隔（秒），降低低等级账号触发阿瓦隆的概率
  min_publish_interval_seconds: 120
  # 检测到阿瓦隆 state=17 隐藏后，自动暂停评论回复的时长（秒），到期自动恢复
  risk_pause_seconds: 7200

# ── 视频分析（视听双轨理解） ──
# 注意：Vision/ASR 模型配置已迁移到 vision_providers / asr_providers + model_routing
# 此段保留视频分析的资源边界和抽帧策略
video_analysis:
  # 启用视频下载 + 视听双轨分析（需要 ffmpeg）
  enabled: false
  # PRD-V5 §8.2 VID-503：资源边界配置
  max_duration_seconds: 600
  max_download_bytes: 209715200
  max_concurrent_global: 1
  max_concurrent_per_account: 1
  download_timeout_seconds: 90
  preprocess_timeout_seconds: 180
  analysis_timeout_seconds: 600
  max_local_whisper_workers: 1
  temp_disk_quota_bytes: 1073741824
  # 抽帧策略: katna / scenedetect / ffmpeg
  frame_extractor: "ffmpeg"
  scenedetect_threshold: 27.0
  image_max_size: 768
  # 抽帧上限：镜头数 ≤ 本值则按镜头全抽；超过则在镜头中点上等距抽本值张
  # 默认 32；未开启帧拼接时运行时硬顶 64
  max_keyframes: 32
  # 帧拼接（九宫格）：把连续帧合并成一张带编号的大图，一次 Vision 请求描述多帧，
  # 从而在不增加请求数量的前提下成倍提高抽帧数量（硬顶变为 64 * frames_per_tile）
  frame_pack_enabled: false
  frames_per_tile: 4          # 每张拼接图包含的帧数（1-9，建议 4）
  frame_pack_tile_size: 512   # 拼接图内每格的最大边长（像素）
  # 视觉并发窗口（期望值）；实际并发 = min(本值, 视觉硬顶, 密钥数×每密钥并发)
  vision_window_size: 2
  # 视觉请求起步速率（每分钟）；多 key 时运行时按密钥数线性放大
  vision_requests_per_minute: 10
  # 单帧 Vision 瞬时故障（连接错误/超时）额外重试次数
  vision_frame_max_retries: 2
  # 单帧重试退避基数（秒）：第 n 次等待 n * 该值
  vision_frame_retry_backoff_seconds: 1.5
  # require_complete 时最低成功帧比例（0~1）；达到即可继续，不必 100% 帧都成功
  vision_min_success_ratio: 0.5
  # 临时目录（留空则用 {data_dir}/video_temp）
  temp_dir: ""

# ── 记忆系统 ──
# 每账号库：data/accounts/<account_id>/memory_brain.db（V6 统一认知脑）
# 归档失败（不可恢复观察）会 pause_account(reason=memory_archive_failed)，
# 修复可写后 resume_account 恢复主动行为。
memory:
  # V6 账号级统一联想记忆大脑
  recall_candidate_limit: 12
  recall_inject_limit: 5
  recall_association_limit: 2
  # 单次 LLM rerank 的硬预算；召回总预算是 embedding + rerank 的模型调用软预算，
  # 本地 SQLite 检索不受它约束。超时保留 FTS/vector 确定性结果
  rerank_timeout_seconds: 8
  # 真实大库（>20k chunks）实测 10s 会让 chunk_vector/global_recent 通道超时，
  # 生产/调试召回结果抖动；建议 30s。
  recall_total_timeout_seconds: 30
  rerank_relevance_baseline: 0.65
  # 确定性 fallback 注入阈值。中文口语查询即使命中多个特征词，
  # lexical_coverage 也常在 0.43 左右；0.80/0.88 会全部拒掉。
  # 追求更保守时再调回 0.80/0.88。
  fallback_direct_threshold: 0.40
  fallback_association_threshold: 0.55
  # 专用交叉编码器（BGE 式 0..1 分数）比 chat JSON 重排分数软，独立基线
  rerank_model_relevance_baseline: 0.20
  # 后台富化（摘要/实体/关联）单次调用预算。推理型模型常把输出预算
  # 花在 reasoning_content 上，12s 会频繁超时；实测建议 300。
  enrichment_chat_timeout_seconds: 300
  link_candidate_limit: 12
  link_job_max_attempts: 3
  prompt_char_budget: 5000
  chunk_target_chars: 600
  chunk_hard_chars: 900
  chunk_target_tokens: 450
  chunk_hard_tokens: 700
  chunk_overlap_chars: 100
  job_max_attempts: 8
  vector_cache_limit: 50000
  # 向量全表扫描行数预算（默认 5 万行，约 200MB BLOB，冷扫描约 2-3 秒）。
  # 超出时向量通道报错并降级 FTS/确定性检索，避免超大记忆库拖死在线回复。
  # NVMe/大内存环境可调大；100GB 级库应迁移 ANN 索引，而不是设 0。
  vector_full_scan_row_limit: 50000
  vector_batch_size: 2048
  # 大库召回策略（默认 false）：只对 FTS/标识符/图扩展先命中的事件做向量精排。
  # 100GB 级记忆库建议开启：向量扫描从全表缩小到数百个候选，恢复秒级响应；
  # 代价是词面完全无关的纯语义召回会被跳过。
  vector_candidate_prefilter: false

# ── Web 管理面板 ──
# 安全建议：
# - host 默认仅本机；需要远程访问时再改为 0.0.0.0，并务必改掉默认密码 + 前置反向代理/HTTPS
# - admin_password 为默认 admin123（明文或 bcrypt 哈希匹配）且 host 非 localhost 时，进程将拒绝启动 Web
# - bcrypt 支持 $2a$/$2b$/$2y$ 三种前缀；配置 PATCH 对已哈希密码不会再二次哈希
# - 登录限流使用「直连 IP」+「IP+用户名」双桶，反向代理共享出口 IP 时不会一个攻击者锁死所有用户
# - 会话为进程内存储，仅支持单进程（workers=1），勿多副本横向扩展 Web
# - 配置 PATCH 使用 config_revision 乐观锁；OBJECT_ARRAY（profiles/accounts/*_providers）禁止用字符串提交
# - 备份 create 原子写 .name.creating + replace；list/download/restore/delete 均跳过半成品；过期 staging 约 1h 清理
# - 关闭进程时账号实例会 drain 记忆队列 + run_jobs_until_idle，勿强制 taskkill 丢向量任务
# - logging.file / 日志下载限制在 data_dir 内；token-usage today 支持 account_id 过滤并附 scene_labels
web:
  enabled: true
  host: "127.0.0.1"  # 推荐本机；仅在确知风险时改为 0.0.0.0
  port: 8080
  secret_key: "change-this-to-a-random-string"  # 会话签名密钥，生产环境务必修改
  admin_username: "admin"
  # 默认弱口令！生产必须修改；可用 bcrypt 哈希（$2b$...），勿保留 admin123
  admin_password: "admin123"
  # 会话 TTL（秒），超时自动登出
  session_ttl_seconds: 3600
  # CORS 允许来源，留空表示不开放任意跨域（生产建议保持空）
  # 如需前端独立部署可填具体来源，如 ["http://localhost:3000"]
  cors_origins: []
  # 是否启用 Secure Cookie（仅 HTTPS 下生效；HTTP 本地开发可设 false）
  secure_cookies: true
  # 可信代理列表：仅当请求直连 IP 在此列表中时才信任 X-Forwarded-For 首段作为客户端 IP
  # 用于防止登录限流被伪造 X-Forwarded-For 绕过。留空表示不信任任何代理，始终使用直连 IP
  # 示例: ["127.0.0.1", "10.0.0.2"]
  trusted_proxies: []

# ── CLI ──
# PRD 5.1：cli.enabled 无代码引用，已删除（CLI 入口由 __main__.py 直接判断 --quickstart 参数）

# ── 数据目录 ──
data_dir: "./data"  # 默认在当前目录下的data文件夹

# ── 日志 ──
logging:
  level: "INFO"  # DEBUG / INFO / WARNING / ERROR
  file: "./data/bililog.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5
